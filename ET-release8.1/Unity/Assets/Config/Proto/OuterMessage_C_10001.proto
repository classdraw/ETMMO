//////////////////////背包///////////////////////////////////////////
message ItemProto
{
	int32 ConfigId = 1;
	int32 ContainerType = 2;
	int64 Id = 3;
	int32 Count = 4;
	int32 ItemQuality  = 5;
	EquipInfoProto EquipInfo = 6;
}

message M2C_UpdateItemInfo // IMessage
{
	int32 Op = 1;
	ItemProto ItemInfo = 2;
}

// ResponseType M2C_GetAllKnapsack
message C2M_GetAllKnapsack // ILocationRequest
{
	int32 RpcId = 1;
}

message M2C_GetAllKnapsack // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	repeated ItemProto ItemList = 4;
}

// ResponseType M2C_AddKnapsackItem
message C2M_AddKnapsackItem // ILocationRequest
{
	int32 RpcId = 1;
	int32 ContainerType = 2;
	int32 ConfigId = 3;
}

message M2C_AddKnapsackItem // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType M2C_RemoveKnapsackItem
message C2M_RemoveKnapsackItem // ILocationRequest
{
	int32 RpcId = 1;
	int32 ContainerType = 2;
	int64 ItemId = 3;
}

message M2C_RemoveKnapsackItem // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

message M2C_SyncAllKnapsackItems // IMessage
{
	repeated ItemProto ItemList = 1;
}

message AttributeEntryProto
{
	int64 Id = 1;
	int32 Key = 2;
	int64 Value = 3;
	int32 EntryType = 4;
}


message EquipInfoProto
{
	int64 Id    = 1;
	int32 Score = 2;
	repeated AttributeEntryProto AttributeEntryProtoList = 3;
}

//////////////////////背包///////////////////////////////////////////
//////////////////////排行榜///////////////////////////////////////////
message RankInfoProto
{
	int64 Id      = 1;
	int64 UnitId  = 2;
	string Name   = 4;
	int64  RankValue  = 5;
}

//ResponseType Rank2C_GetRanksInfo
message C2Rank_GetRanksInfo // IRankInfoRequest
{
	int32 RpcId        = 1;
}


message Rank2C_GetRanksInfo // IRankInfoResponse
{
	int32 RpcId    = 1;
	int32 Error    = 2;
	string Message = 3;
	repeated RankInfoProto RankInfoProtoList = 4;
}
