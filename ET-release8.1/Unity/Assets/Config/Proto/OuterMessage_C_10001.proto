	int32 RpcId = 1;
}

message M2C_TestNumericValue // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	string response = 4;
}

message M2C_NoticeUnitNumeric // IMessage
{
	int64 UnitId = 1;
	int32 NumericType = 2;
	int64 NewValue = 3 ;
}

message M2C_NoticeNumericMsg // IMessage
{
	int32 NumericType = 1;
	int64 NewValue = 2;
}

