//////////////////////技能///////////////////////////////////////////
//cast开头
// ResponseType M2C_CastStart
message C2M_CastStart // ILocationRequest
{
	int32 RpcId = 1;
	int32 CastConfigId = 2;//技能配表id
	Unity.Mathematics.float3 InputPos = 3;//输入坐标
	int64 InputUnitId = 4;//目标对象id
}

//cast回调
message M2C_CastStart // ILocationResponse
{
  	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 CastId = 4;//技能uuid
	int64 CasterId = 5;//释放者id
	int32 CastConfigId = 6;//技能配置表id
	repeated int64 TargetsId = 7;//所有目标
}
//cast结束
message M2C_CastFinish // IMessage
{
	int64 CastId = 1;//技能uuid 
	int64 CasterId = 2;//释放者id
}
//cast打断
message M2C_CastBreak // IMessage
{
	int64 CastId = 1;//技能uuid 
	int64 CasterId = 2;//释放者id
}
//cast命中
message M2C_CastHit // IMessage
{
	int64 CastId = 1;//技能uuid 
	int64 CasterId = 2;//释放者id
	repeated int64 TargetsId = 3;//所有目标
}

//////////////////////技能///////////////////////////////////////////


//////////////////////Buff///////////////////////////////////////////
//buff
message BuffProto 
{
	int64 Id = 1;
	int32 ConfigId = 2;
	int64 ExpireTime = 3;
	int64 CreateTime = 4;
	byte[] ExtraData = 5;
}
//buff添加
message M2C_BuffAdd // IMessage
{
	int64 UnitId = 1;
	BuffProto BuffData = 2;
}
//buff迭代
message M2C_BuffTick // IMessage
{
  	int64 UnitId = 1;
	int64 BuffId = 2;
}
//buff更新
message M2C_BuffUpdate // IMessage
{
    int64 UnitId = 1;
	BuffProto BuffData = 2;
}
//buff移除
message M2C_BuffRemove // IMessage
{
    int64 UnitId = 1;
	int64 BuffId = 2;
}
